<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Моя обычная жизнь</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <!-- Шапка -->
    <header id="header" class="header hidden">
      <div class="header-left">
        <span id="char-name">—</span>
        <span id="char-age" class="muted"></span>
      </div>
      <div class="header-right">
        <button id="btn-sound" class="icon-btn" title="Звук">🔊</button>
        <button id="btn-menu" class="icon-btn" title="Меню">☰</button>
      </div>
    </header>

    <!-- Статы -->
    <div id="stats-bar" class="stats-bar hidden">
      <div class="stat" data-stat="health" title="Здоровье">
        <span class="stat-icon">❤️</span>
        <div class="stat-track"><div class="stat-fill" id="stat-health"></div></div>
      </div>
      <div class="stat" data-stat="happy" title="Счастье">
        <span class="stat-icon">😊</span>
        <div class="stat-track"><div class="stat-fill" id="stat-happy"></div></div>
      </div>
      <div class="stat" data-stat="intel" title="Интеллект">
        <span class="stat-icon">🧠</span>
        <div class="stat-track"><div class="stat-fill" id="stat-intel"></div></div>
      </div>
      <div class="stat" data-stat="social" title="Общительность">
        <span class="stat-icon">💬</span>
        <div class="stat-track"><div class="stat-fill" id="stat-social"></div></div>
      </div>
    </div>

    <!-- Главный экран -->
    <main id="screen">
      <!-- Меню -->
      <section id="screen-menu" class="screen">
        <div class="hero">
          <div class="hero-emoji">🌱</div>
          <h1>Моя обычная жизнь</h1>
          <p class="subtitle">Симулятор жизни от рождения до старости</p>
        </div>
        <div class="menu-actions">
          <button class="btn btn-primary" id="btn-new-game">Новая жизнь</button>
          <button class="btn btn-secondary" id="btn-continue">Продолжить</button>
          <button class="btn btn-secondary" id="btn-slots">Слоты сохранений</button>
          <button class="btn btn-secondary" id="btn-shop">⭐ Магазин</button>
          <button class="btn btn-ghost" id="btn-achievements">Достижения</button>
        </div>
        <p class="footer-note">Полная жизнь · Stars-косметика · 3+ слота</p>
      </section>

      <!-- Магазин -->
      <section id="screen-shop" class="screen hidden">
        <h2>⭐ Магазин</h2>
        <p class="muted" style="margin-bottom:12px;font-size:13px">Косметика и удобства. Не влияет на «правильный» конец жизни.</p>
        <div id="shop-list" class="shop-list"></div>
        <button class="btn btn-ghost" id="btn-shop-back">Назад</button>
      </section>

      <!-- Достижения -->
      <section id="screen-achievements" class="screen hidden">
        <h2>Достижения</h2>
        <div id="ach-list" class="ach-list"></div>
        <button class="btn btn-ghost" id="btn-ach-back">Назад</button>
      </section>

      <!-- Мини-игра викторина -->
      <section id="screen-quiz" class="screen hidden">
        <div class="quiz-box">
          <div class="quiz-timer" id="quiz-timer"></div>
          <h3 id="quiz-q"></h3>
          <div id="quiz-choices" class="choices"></div>
          <p id="quiz-status" class="muted" style="margin-top:12px;font-size:13px"></p>
        </div>
      </section>

      <!-- Создание персонажа -->
      <section id="screen-create" class="screen hidden">
        <h2>Начало жизни</h2>
        <label class="field">
          <span>Имя</span>
          <input type="text" id="input-name" maxlength="20" placeholder="Как назовут ребёнка?" />
        </label>
        <label class="field">
          <span>Пол</span>
          <div class="segment">
            <button type="button" class="seg active" data-gender="m">Мальчик</button>
            <button type="button" class="seg" data-gender="f">Девочка</button>
          </div>
        </label>
        <label class="field">
          <span>Страна</span>
          <select id="input-country">
            <option value="kz">Казахстан</option>
            <option value="ru">Россия</option>
            <option value="uz">Узбекистан</option>
            <option value="other">Другая</option>
          </select>
        </label>
        <label class="field">
          <span>Доход семьи</span>
          <select id="input-income">
            <option value="low">Скромный</option>
            <option value="mid" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
        </label>
        <button class="btn btn-primary" id="btn-start-life">Родиться</button>
        <button class="btn btn-ghost" id="btn-back-menu">Назад</button>
      </section>

      <!-- Слоты -->
      <section id="screen-slots" class="screen hidden">
        <h2>Сохранения</h2>
        <div id="slots-list" class="slots-list"></div>
        <button class="btn btn-ghost" id="btn-slots-back">Назад</button>
      </section>

      <!-- Игровой экран -->
      <section id="screen-play" class="screen hidden">
        <div id="event-card" class="event-card">
          <div id="event-scene" class="event-scene">🏠</div>
          <div id="event-period" class="event-period"></div>
          <h3 id="event-title"></h3>
          <p id="event-text"></p>
          <div id="event-choices" class="choices"></div>
        </div>
      </section>

      <!-- Сводка этапа -->
      <section id="screen-summary" class="screen hidden">
        <div class="summary-card">
          <div class="summary-emoji">📋</div>
          <h2 id="summary-title">Итоги этапа</h2>
          <p id="summary-text"></p>
          <div id="summary-traits" class="traits"></div>
          <div id="summary-stats" class="summary-stats"></div>
          <button class="btn btn-primary" id="btn-next-stage">Дальше</button>
          <button class="btn btn-ghost" id="btn-save-exit">Сохранить и выйти</button>
        </div>
      </section>

      <!-- Конец жизни / заглушка следующих этапов -->
      <section id="screen-end" class="screen hidden">
        <div class="hero">
          <div class="hero-emoji">🌅</div>
          <h2 id="end-title">Пока всё</h2>
          <div id="end-bio" class="bio-card-premium hidden"></div>
          <p id="end-text"></p>
          <button class="btn btn-primary" id="btn-bio-pretty">Открытка биографии ⭐</button>
          <button class="btn btn-secondary" id="btn-share-bio">Поделиться текстом</button>
          <button class="btn btn-ghost" id="btn-to-menu">В меню</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/core.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/stages/stage0_3.js"></script>
  <script src="js/stages/stage3_6.js"></script>
  <script src="js/stages/stage6_11.js"></script>
  <script src="js/stages/stage11_16.js"></script>
  <script src="js/stages/stage16_18.js"></script>
  <script src="js/stages/stage18_25.js"></script>
  <script src="js/stages/stage25_40.js"></script>
  <script src="js/stages/stage40_60.js"></script>
  <script src="js/stages/stage60_end.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
